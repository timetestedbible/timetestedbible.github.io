<svg xmlns="http://www.w3.org/2000/svg" viewBox="-100 -100 1200 1250" width="100%" height="100%" style="background-color: #0f172a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  
  <defs>
    <marker id="arrow-start" markerWidth="8" markerHeight="8" refX="0" refY="4" orient="auto">
      <polygon points="8,0 0,4 8,8" fill="#cbd5e1" />
    </marker>
    <marker id="arrow-end" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto">
      <polygon points="0,0 8,4 0,8" fill="#cbd5e1" />
    </marker>
  </defs>

  <text x="500" y="-60" fill="#f8fafc" font-size="28" font-weight="bold" text-anchor="middle" letter-spacing="2">THE HOLY OBLATION</text>
  <text x="500" y="-35" fill="#94a3b8" font-size="16" text-anchor="middle">Ezekiel 48:8-20, 30-35</text>

  <line x1="0" y1="-10" x2="1000" y2="-10" stroke="#cbd5e1" stroke-width="1.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)" />
  <text x="500" y="-18" fill="#cbd5e1" font-size="14" text-anchor="middle">25,000 measures (~50 miles)</text>

  <line x1="-15" y1="0" x2="-15" y2="1000" stroke="#cbd5e1" stroke-width="1.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)" />
  <text x="-25" y="500" fill="#cbd5e1" font-size="14" text-anchor="middle" transform="rotate(-90, -25, 500)">25,000 measures (~50 miles)</text>

  <rect x="-2" y="-2" width="1004" height="1004" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="10, 10" />

  <g transform="translate(0, 0)">
    <rect width="1000" height="400" fill="#fef08a" stroke="#1e293b" stroke-width="2" />
    <text x="500" y="190" fill="#0f172a" font-size="22" font-weight="bold" text-anchor="middle">LEVITES' PORTION (NORTH)</text>
    <text x="500" y="215" fill="#334155" font-size="16" text-anchor="middle">25,000 × 10,000 measures</text>
    <text x="980" y="205" fill="#334155" font-size="14" text-anchor="end" transform="rotate(-90, 980, 205)">10,000</text>
  </g>

  <g transform="translate(0, 400)">
    <rect width="1000" height="400" fill="#fcd34d" stroke="#1e293b" stroke-width="2" />
    <text x="500" y="120" fill="#0f172a" font-size="22" font-weight="bold" text-anchor="middle">PRIESTS' PORTION (MIDDLE)</text>
    <text x="500" y="145" fill="#334155" font-size="16" text-anchor="middle">25,000 × 10,000 measures</text>
    <text x="980" y="205" fill="#334155" font-size="14" text-anchor="end" transform="rotate(-90, 980, 205)">10,000</text>

    <g transform="translate(470, 170)">
      <rect width="60" height="60" fill="#ffffff" stroke="#0f172a" stroke-width="3" />
      <circle cx="30" cy="30" r="18" fill="none" stroke="#0f172a" stroke-width="2" />
      <circle cx="30" cy="30" r="6" fill="#0f172a" />
      <line x1="10" y1="30" x2="50" y2="30" stroke="#0f172a" stroke-width="1" />
      <line x1="30" y1="10" x2="30" y2="50" stroke="#0f172a" stroke-width="1" />
    </g>
    <text x="500" y="250" fill="#0f172a" font-size="14" font-weight="bold" text-anchor="middle">THE SANCTUARY</text>
    <text x="500" y="265" fill="#334155" font-size="12" text-anchor="middle">(500 × 500 measures)</text>
  </g>

  <g transform="translate(0, 800)">
    
    <rect x="0" y="0" width="400" height="200" fill="#e2e8f0" stroke="#1e293b" stroke-width="2" />
    <text x="200" y="95" fill="#0f172a" font-size="18" font-weight="bold" text-anchor="middle">CITY AGRICULTURE</text>
    <text x="200" y="115" fill="#334155" font-size="14" text-anchor="middle">10,000 × 5,000</text>

    <rect x="400" y="0" width="200" height="200" fill="#bfdbfe" stroke="#1e293b" stroke-width="2" />
    
    <text x="500" y="18" fill="#0f172a" font-size="10" font-weight="bold" text-anchor="middle">250 SUBURBS</text>
    <text x="500" y="192" fill="#0f172a" font-size="10" font-weight="bold" text-anchor="middle">250 SUBURBS</text>
    
    <rect x="410" y="10" width="180" height="180" fill="#ffffff" stroke="#0f172a" stroke-width="3" />
    
    <text x="500" y="85" fill="#0f172a" font-size="16" font-weight="bold" text-anchor="middle">THE CITY</text>
    <text x="500" y="105" fill="#334155" font-size="12" text-anchor="middle">4,500 × 4,500</text>
    <text x="500" y="120" fill="#334155" font-size="12" text-anchor="middle">(~9 × 9 miles)</text>
    <text x="500" y="135" fill="#334155" font-size="12" text-anchor="middle">(~80 sq mi)</text>

    <rect x="600" y="0" width="400" height="200" fill="#e2e8f0" stroke="#1e293b" stroke-width="2" />
    <text x="800" y="95" fill="#0f172a" font-size="18" font-weight="bold" text-anchor="middle">CITY AGRICULTURE</text>
    <text x="800" y="115" fill="#334155" font-size="14" text-anchor="middle">10,000 × 5,000</text>

    <text x="980" y="105" fill="#334155" font-size="14" text-anchor="end" transform="rotate(-90, 980, 105)">5,000</text>
  </g>

  <text x="500" y="1050" fill="#cbd5e1" font-size="16" font-weight="bold" text-anchor="middle">Total Area: 25,000 × 25,000 measures (~50 × 50 miles, ~2,472 sq mi)</text>
  <text x="500" y="1075" fill="#94a3b8" font-size="14" text-anchor="middle">1 reed = 6 long cubits = 10.5 feet (Ezek 40:5)</text>
  <text x="500" y="1100" fill="#94a3b8" font-size="14" font-style="italic" text-anchor="middle">The Sanctuary sits centered in the Priests' portion. The 9×9 mile City is flanked</text>
  <text x="500" y="1120" fill="#94a3b8" font-size="14" font-style="italic" text-anchor="middle">by 250-measure suburbs and 10,000-measure agricultural lands.</text>

</svg>
