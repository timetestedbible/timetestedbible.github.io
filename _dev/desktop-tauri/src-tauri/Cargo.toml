[package]
name = "timetested-desktop"
version = "0.1.0"
description = "Time Tested Bible — desktop (Tauri)"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Updater (mirrors _dev/desktop/updater.js): blocking HTTP + pure-Rust gzip/tar,
# so there is no dependency on a system `tar` binary like the Electron version has.
ureq = "2"
flate2 = "1"
tar = "0.4"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
