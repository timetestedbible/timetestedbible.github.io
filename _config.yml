# Jekyll configuration for Time Tested Bible
# GitHub Pages runs Jekyll automatically — no manual build step needed.
# Only files with YAML frontmatter (---) are processed by Jekyll.
# All other files (JS, CSS, images, data) pass through unchanged.

# Exclude directories and files that Jekyll should never touch
exclude:
  - node_modules
  - _dev
  - pipeline
  - scripts
  - brank
  - http-v1
  - http-v2
  - http
  - morphhb-source
  - source
  - wlc
  - _trash
  - agent-transcripts
  - assets/img-originals
  - data/interlinear.json
  - LICENSE
  - README.md
  - package.json
  - package-lock.json
  - Gemfile
  - Gemfile.lock
  - "**/*.md.orig"
  # Book dev docs — authoring pipeline, never deployed
  - books/symbolic-language/CLAUDE.md
  - books/symbolic-language/plate-descriptions.md
  - books/symbolic-language/plate-captions.md
  - books/symbolic-language/research
  - books/symbolic-language/editorial-review
  - books/symbolic-language/audio
  - books/symbolic-language/print
  - books/symbolic-language/draft-meat-intro.md
  - books/symbolic-language/reflow-sentences.rb
  # Frozen experiment chapters have book front matter and would otherwise
  # compete with the live chapters' permalinks. The dashboard generator copies
  # them with SHA-256 hashes in data/meat-tester-sources/*.json for public audit.
  - "books/symbolic-language/experiments/glossary-consensus/runs/**/inputs/chapters"

# Study collections
collections:
  symbols:
    output: true
    permalink: /research/symbols/:path/
  verses:
    output: true
    permalink: /research/verses/:path/

# Plugins (custom GitHub Actions build — not restricted to the Pages safelist)
plugins:
  - jekyll-asciidoc

# AsciiDoc rendering (the "Bible's Symbolic Language" book). Static, build-time.
asciidoctor:
  attributes:
    - showtitle@        # let the layout render the title, not Asciidoctor
    - sectanchors       # anchor links on headings
    - sectlinks
    - idprefix=_
    - idseparator=-
    - imagesdir=/assets/img   # chapter figures resolve to site assets (color renditions; print swaps in -print.svg siblings)

# Blog post permalink structure
permalink: /blog/:slug/

# Default frontmatter values — pages can override any of these
defaults:
  # Site-wide defaults
  - scope:
      path: ""
    values:
      layout: "default"
      page_title: "Time Tested Bible"
      og_title: "Time Tested Bible"
      og_description: "Bible study app with lunar calendar, Strong's concordance, interlinear Hebrew/Greek, word studies, and historical timeline."
      og_image: "https://timetested.bible/icons/og-image.png"
      og_url: "https://timetested.bible/"
      og_type: "website"
      keywords: "bible study, biblical calendar, hebrew calendar, strongs concordance, interlinear bible, feast days, sabbath calendar, moon phases, biblical timeline, appointed times, torah portions"
      author: "Time Tested Bible"
      description: "Bible study app with lunar calendar, Strong's concordance, interlinear Hebrew/Greek, word studies, and historical timeline. Track Sabbaths, feast days, and appointed times."
  # Blog post defaults — use blog-post layout for OG tags + embedded content
  - scope:
      path: "_posts"
      type: posts
    values:
      layout: "blog-post"
      og_type: "article"
  # Symbol study defaults
  - scope:
      path: "_symbols"
      type: symbols
    values:
      layout: "symbol-study"
      og_type: "article"
      author: "Time Tested Bible"
      og_image: "https://timetested.bible/icons/og-image.png"
  # Verse study defaults
  - scope:
      path: "_verses"
      type: verses
    values:
      layout: "verse-study"
      og_type: "article"
      author: "Time Tested Bible"
      og_image: "https://timetested.bible/icons/og-image.png"
  # "The Bible's Symbolic Language" book — AsciiDoc chapters
  - scope:
      path: "books/symbolic-language"
    values:
      layout: "book-chapter"
      book: "MEAT The Bible's Symbolic Language"
      book_slug: "symbolic-language"
      og_type: "article"
      author: "Time Tested Bible"
      og_image: "https://timetested.bible/icons/og-image.png"
