# Asciidoctor PDF theme — "The Bible's Symbolic Language"
# Trade paperback, 6in x 9in. Use with:  -a pdf-theme=trade -a pdf-themesdir=<this dir>
#
# BookBaby requires a PURE BLACK interior — every ink value here is '000000'
# (quoted so YAML keeps it a hex string, not the integer 0). No gray, no color.
extends: default

# Hebrew glyphs: fall back to Noto Serif Hebrew (OFL, bundled in ./fonts) so
# unpointed consonants render in print. RTL ordering is handled by asciidoctor-pdf.
# Paleo-Hebrew / Phoenician glyphs (the divine name) fall back to Noto Sans Phoenician (OFL, bundled).
font:
  catalog:
    merge: true
    Noto Serif Hebrew:
      normal: NotoSerifHebrew-Regular.ttf
      bold: NotoSerifHebrew-Bold.ttf
      italic: NotoSerifHebrew-Regular.ttf
      bold_italic: NotoSerifHebrew-Bold.ttf
    Noto Sans Phoenician:
      normal: NotoSansPhoenician-Regular.ttf
      bold: NotoSansPhoenician-Regular.ttf
      italic: NotoSansPhoenician-Regular.ttf
      bold_italic: NotoSansPhoenician-Regular.ttf
  fallbacks:
    - Noto Serif Hebrew
    - Noto Sans Phoenician

page:
  size: [6in, 9in]
  # Generous inner (gutter) margin for perfect-bound trade books.
  margin: [0.7in, 0.65in, 0.7in, 0.8in]   # [top, right, bottom, left] (screen mode)
  margin-inner: 0.85in                      # gutter side (prepress/facing-pages)
  margin-outer: 0.6in

base:
  font-family: Noto Serif
  font-size: 10.5
  line-height: 1.46
  text-align: justify
  font-color: '000000'

heading:
  font-family: Noto Serif
  font-style: bold
  font-color: '000000'
  h1-font-size: 22
  h2-font-size: 16
  h3-font-size: 13

# Title page is supplied as a full-page front-cover SVG; the auto title page is
# disabled (:notitle:). These keys are unused but kept black for safety.
title-page:
  align: center
  title:
    font-size: 30
    font-color: '000000'
    line-height: 1.1
  subtitle:
    font-size: 14
    font-color: '000000'
  authors:
    font-size: 12
    font-color: '000000'

prose:
  margin-bottom: 0
  text-indent: 0.2in   # book first-line indent on every body paragraph
                       # (the converter zeroes this while rendering quotes — see extension.rb)

block:
  margin-bottom: 10

# Scripture / quote blocks — no rule, indented both sides, body-size italic text
quote:
  font-style: italic
  font-color: '000000'
  font-size: $base-font-size      # same size as regular text
  border-width: 0
  border-left-width: 0            # THE key for the left vertical bar (separate from border-width)
  padding: [3, 30, 3, 30]         # [t,r,b,l] — indent both left and right, no border
  cite:
    font-size: 8.5
    font-style: normal
    font-color: '000000'

# Roles applied by the build script's transforms.
# (Alignment comes from the built-in text-center/text-right roles; these add styling.)
role:
  epigraph:
    font-style: italic
    font-color: '000000'
  citation:
    font-size: 8.5
    font-style: normal
    font-color: '000000'
  chapter-epigraph:
    font-style: italic
    font-color: '000000'
  chapter-epigraph-cite:
    font-size: 9
    font-style: normal
    font-color: '000000'
  # Glossary cross-references to other symbols: fixed-width, bold, pure black
  # (applied as [.symbol]`word` — codespan supplies the monospace face).
  symbol:
    font-family: M+ 1mn
    font-style: bold
    font-color: '000000'
  # Glossary "see <chapter>" pointer line — italic, smaller, set off from the definition
  seeref:
    font-style: italic
    font-size: 9
    font-color: '000000'
  # Scripture references inside a definition — small italic, kept out of the way
  scref:
    font-style: italic
    font-size: 8.5
    font-color: '000000'
  # Copyright / colophon page — small, quiet type (alignment via text-center)
  copyright:
    font-size: 9
    font-color: '000000'
    line-height: 1.5
  copyright-title:
    font-size: 12
    font-style: italic
    font-color: '000000'

# Prevalence tables — clean "booktabs" style: pure-black horizontal rules only
# (top rule, rule under the header, bottom rule), no shading, no vertical lines.
table:
  font-color: '000000'
  font-size: 9.5
  border-color: '000000'
  border-width: 1.25        # top + bottom rules (frame=topbot)
  grid-color: '000000'
  grid-width: 0.5          # only drawn when a table uses grid=rows/cols/all
  head:
    font-style: bold
    background-color: 'ffffff'
    border-bottom-width: 1.25   # the rule under the header
    border-bottom-color: '000000'
  body:
    background-color: 'ffffff'
  cell:
    padding: [2.5, 9, 2.5, 9]
table-caption:
  font-style: italic
  font-color: '000000'
  font-size: 9
  align: center

# Links and TOC — pure black (no blue), dot leaders for the contents page.
link:
  font-color: '000000'
toc:
  font-color: '000000'
  dot-leader:
    content: '. '
    font-color: '000000'

# Footnotes — rendered at the foot of each page by the converter (extension.rb),
# not as chapter-end notes. Small, pure black.
footnotes:
  font-size: 8.5
  font-color: '000000'
  item-spacing: 3

page-numbering:
  start-at: after-toc
running-content:
  start-at: after-toc
header:
  height: 0.6in
  margin: [0.2in, inherit, 0, inherit]   # push header down from the trim edge (BookBaby 0.5in safety)
  recto:
    right:
      content: '{chapter-title}'
  verso:
    left:
      content: 'The Bible''s Symbolic Language'
  font-size: 8
  font-color: '000000'
footer:
  height: 0.6in
  margin: [0, inherit, 0.2in, inherit]   # lift folio up from the trim edge (BookBaby 0.5in safety)
  # footer separator keeps the inherited light-gray (DDDDDD) hairline — gray is fine for non-text rules
  recto:
    right:
      content: '{page-number}'
  verso:
    left:
      content: '{page-number}'
  font-size: 9
  font-color: '000000'
