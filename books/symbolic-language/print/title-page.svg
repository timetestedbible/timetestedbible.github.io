<?xml version="1.0" encoding="UTF-8"?>
<!-- Title page for the 6x9 trade edition (432pt x 648pt), mirroring the cover
     lockup at 72pt/in: MEAT in tall italic caps with an underline (the book's
     register for a word under study), THE BIBLE'S / SYMBOLIC / LANGUAGE
     bracketed by a matching closing rule, author beneath the frame. Lines are
     stretched with textLength so the block shares one width; tall caps come
     from a non-uniform scale with y pre-divided by the factor.
     All ink is pure black (#000000) — BookBaby rejects color/gray in the interior. -->
<svg xmlns="http://www.w3.org/2000/svg" width="432" height="648" viewBox="0 0 432 648">
  <rect width="432" height="648" fill="#ffffff"/>

  <g font-family="Noto Serif" fill="#000000" text-anchor="middle">
    <!-- MEAT — baseline 216 (y = 216/1.18); block raised 54pt to the optical center -->
    <text x="216" y="183.05" font-size="73.4" font-style="italic" font-weight="bold"
          transform="scale(1,1.18)" textLength="241.2" lengthAdjust="spacingAndGlyphs">MEAT</text>
    <!-- underline / top of the frame -->
    <rect x="95.4" y="226" width="241.2" height="3"/>
    <!-- subtitle — baselines 268.6 / 311.8 / 355 (y pre-divided by 1.22) -->
    <text x="216" y="220.2" font-size="37.4" transform="scale(1,1.22)" textLength="234" lengthAdjust="spacingAndGlyphs">THE BIBLE&#8217;S</text>
    <text x="216" y="255.6" font-size="37.4" transform="scale(1,1.22)" textLength="234" lengthAdjust="spacingAndGlyphs">SYMBOLIC</text>
    <text x="216" y="291.0" font-size="37.4" transform="scale(1,1.22)" textLength="234" lengthAdjust="spacingAndGlyphs">LANGUAGE</text>
    <!-- closing rule -->
    <rect x="95.4" y="365" width="241.2" height="3"/>
    <!-- author -->
    <text x="216" y="399.6" font-size="15.8" letter-spacing="1.8">DANIEL LARIMER</text>
  </g>

  <!-- epigraph -->
  <g font-family="Noto Serif" font-style="italic" fill="#000000" text-anchor="middle">
    <text x="216" y="566" font-size="11.5">Know ye not this parable? and how then</text>
    <text x="216" y="584" font-size="11.5">will ye know all parables?</text>
    <text x="216" y="608" font-size="11.5">&#8212; Jesus</text>
  </g>
</svg>
