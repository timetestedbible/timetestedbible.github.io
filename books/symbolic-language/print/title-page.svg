<?xml version="1.0" encoding="UTF-8"?>
<!-- Title page for the 6x9 trade edition (432pt x 648pt). The three title
     lines are each stretched with textLength so they share an identical width.
     All ink is pure black (#000000) — BookBaby rejects color/gray in the interior. -->
<svg xmlns="http://www.w3.org/2000/svg" width="432" height="648" viewBox="0 0 432 648">
  <rect width="432" height="648" fill="#ffffff"/>

  <!-- Title: THE BIBLE'S / SYMBOLIC / LANGUAGE — all three the same width -->
  <g font-family="Noto Serif" fill="#000000" text-anchor="middle">
    <text x="216" y="252" font-size="40" textLength="300" lengthAdjust="spacingAndGlyphs">THE BIBLE&#8217;S</text>
    <text x="216" y="306" font-size="40" textLength="300" lengthAdjust="spacingAndGlyphs">SYMBOLIC</text>
    <text x="216" y="360" font-size="40" textLength="300" lengthAdjust="spacingAndGlyphs">LANGUAGE</text>
  </g>

  <!-- thin black rule -->
  <rect x="156" y="392" width="120" height="1.2" fill="#000000"/>

  <!-- author -->
  <text x="216" y="436" font-family="Noto Serif" font-size="15" fill="#000000"
        text-anchor="middle">By Daniel Larimer</text>

  <!-- epigraph -->
  <g font-family="Noto Serif" font-style="italic" fill="#000000" text-anchor="middle">
    <text x="216" y="566" font-size="11.5">Know ye not this parable? and how then</text>
    <text x="216" y="584" font-size="11.5">will ye know all parables?</text>
    <text x="216" y="608" font-size="11.5">&#8212; Jesus</text>
  </g>
</svg>
