<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" font-family="Gentium Book Plus, Georgia, serif">
  <!-- One heavenly original, reflected in two witnesses. Pure black line art
       for reliable rendering in the trade interior and ebook. -->

  <!-- Unseen original -->
  <path d="M250 34 H630 L680 82 L630 130 H250 L200 82 Z"
        fill="none" stroke="#000000" stroke-width="3"/>
  <text x="440" y="72" text-anchor="middle" font-size="25" font-weight="bold" fill="#000000">THE UNSEEN HEAVENLY COURT</text>
  <text x="440" y="101" text-anchor="middle" font-size="19" font-style="italic" fill="#000000">“the true tabernacle, which the Lord pitched” — Hebrews 8:2</text>

  <!-- Branching lines; explicit arrowheads avoid marker issues in the PDF renderer. -->
  <path d="M440 130 V150 H238 V160" fill="none" stroke="#000000" stroke-width="3"/>
  <path d="M440 150 H642 V160" fill="none" stroke="#000000" stroke-width="3"/>
  <line x1="238" y1="200" x2="238" y2="215" stroke="#000000" stroke-width="3"/>
  <line x1="642" y1="200" x2="642" y2="215" stroke="#000000" stroke-width="3"/>
  <path d="M230 215 H246 L238 228 Z" fill="#000000"/>
  <path d="M634 215 H650 L642 228 Z" fill="#000000"/>

  <text x="238" y="190" text-anchor="middle" font-size="18" font-weight="bold" fill="#000000">CREATION DECLARES</text>
  <text x="642" y="190" text-anchor="middle" font-size="18" font-weight="bold" fill="#000000">THE SANCTUARY TEACHES</text>

  <!-- Created witness -->
  <rect x="46" y="230" width="384" height="214" rx="8"
        fill="none" stroke="#000000" stroke-width="3"/>
  <path d="M94 314 Q238 246 382 314" fill="none" stroke="#000000" stroke-width="3"/>
  <circle cx="238" cy="278" r="17" fill="none" stroke="#000000" stroke-width="3"/>
  <line x1="238" y1="252" x2="238" y2="240" stroke="#000000" stroke-width="2"/>
  <line x1="213" y1="278" x2="201" y2="278" stroke="#000000" stroke-width="2"/>
  <line x1="263" y1="278" x2="275" y2="278" stroke="#000000" stroke-width="2"/>
  <circle cx="120" cy="288" r="4" fill="#000000"/>
  <circle cx="342" cy="286" r="4" fill="#000000"/>
  <circle cx="315" cy="259" r="3" fill="#000000"/>
  <text x="238" y="350" text-anchor="middle" font-size="24" font-weight="bold" fill="#000000">THE VISIBLE HEAVENS</text>
  <text x="238" y="379" text-anchor="middle" font-size="18" font-style="italic" fill="#000000">“God called the firmament Heaven”</text>
  <text x="238" y="403" text-anchor="middle" font-size="17" fill="#000000">tent • lights • gates • appointed circuits</text>
  <text x="238" y="428" text-anchor="middle" font-size="16" fill="#000000">Genesis 1:8, 14–18 • Romans 1:20</text>

  <!-- Constructed witness -->
  <rect x="450" y="230" width="384" height="214" rx="8"
        fill="none" stroke="#000000" stroke-width="3"/>
  <path d="M516 315 L516 268 L642 245 L768 268 L768 315" fill="none" stroke="#000000" stroke-width="3"/>
  <line x1="642" y1="245" x2="642" y2="315" stroke="#000000" stroke-width="3"/>
  <line x1="558" y1="260" x2="558" y2="315" stroke="#000000" stroke-width="2"/>
  <line x1="726" y1="260" x2="726" y2="315" stroke="#000000" stroke-width="2"/>
  <text x="642" y="350" text-anchor="middle" font-size="24" font-weight="bold" fill="#000000">THE EARTHLY SANCTUARY</text>
  <text x="642" y="379" text-anchor="middle" font-size="18" font-style="italic" fill="#000000">“a copy and shadow of the heavenly things”</text>
  <text x="642" y="403" text-anchor="middle" font-size="17" fill="#000000">curtains • lampstand • courts • appointed service</text>
  <text x="642" y="428" text-anchor="middle" font-size="16" fill="#000000">Exodus 25:40 • Hebrews 8:5</text>

  <!-- Shared conclusion -->
  <line x1="238" y1="444" x2="238" y2="474" stroke="#000000" stroke-width="3"/>
  <line x1="642" y1="444" x2="642" y2="474" stroke="#000000" stroke-width="3"/>
  <line x1="238" y1="474" x2="642" y2="474" stroke="#000000" stroke-width="3"/>
  <line x1="440" y1="474" x2="440" y2="493" stroke="#000000" stroke-width="3"/>
  <path d="M432 493 H448 L440 506 Z" fill="#000000"/>
  <text x="440" y="532" text-anchor="middle" font-size="21" font-weight="bold" fill="#000000">TWO WITNESSES TO ONE HEAVENLY ORIGINAL</text>
</svg>
