<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" font-family="Gentium Book Plus">
  <!-- The jot and the tittle, drawn large. Pure black for the trade interior.
       Left: the yod (smallest letter) beside the vav — one stroke's length apart.
       Right: dalet vs resh — the tittle is the little horn on the dalet's corner. -->

  <!-- ===== LEFT: THE JOT ===== -->
  <text x="220" y="52" text-anchor="middle" font-size="27" font-weight="bold" fill="#000000">THE JOT</text>
  <text x="220" y="84" text-anchor="middle" font-size="22" font-style="italic" fill="#000000">the yod — the smallest letter</text>

  <text x="150" y="270" text-anchor="middle" font-size="170" font-family="Noto Serif Hebrew" fill="#000000">י</text>
  <text x="310" y="270" text-anchor="middle" font-size="170" font-family="Noto Serif Hebrew" fill="#000000">ו</text>

  <text x="150" y="316" text-anchor="middle" font-size="22" fill="#000000">yod</text>
  <text x="310" y="316" text-anchor="middle" font-size="22" fill="#000000">vav</text>

  <!-- extension mark: the yod's stroke, drawn out -->
  <line x1="150" y1="238" x2="150" y2="288" stroke="#000000" stroke-width="3" stroke-dasharray="5,6"/>

  <text x="220" y="382" text-anchor="middle" font-size="22" fill="#000000">a yod drawn out is a vav —</text>
  <text x="220" y="412" text-anchor="middle" font-size="22" fill="#000000">the two differ by the length of one stroke</text>

  <!-- divider -->
  <line x1="440" y1="40" x2="440" y2="430" stroke="#000000" stroke-width="1"/>

  <!-- ===== RIGHT: THE TITTLE ===== -->
  <text x="660" y="52" text-anchor="middle" font-size="27" font-weight="bold" fill="#000000">THE TITTLE</text>
  <text x="660" y="84" text-anchor="middle" font-size="22" font-style="italic" fill="#000000">the little horn on a letter&#8217;s corner</text>

  <text x="580" y="270" text-anchor="middle" font-size="170" font-family="Noto Serif Hebrew" fill="#000000">ד</text>
  <text x="750" y="270" text-anchor="middle" font-size="170" font-family="Noto Serif Hebrew" fill="#000000">ר</text>

  <text x="580" y="316" text-anchor="middle" font-size="22" fill="#000000">dalet (d)</text>
  <text x="750" y="316" text-anchor="middle" font-size="22" fill="#000000">resh (r)</text>

  <!-- circle the dalet's corner horn -->
  <circle cx="628" cy="186" r="26" fill="none" stroke="#000000" stroke-width="2.5" stroke-dasharray="6,5"/>

  <text x="660" y="382" text-anchor="middle" font-size="22" fill="#000000">one small horn of a stroke</text>
  <text x="660" y="412" text-anchor="middle" font-size="22" fill="#000000">separates dalet from its look-alike, resh</text>
</svg>
