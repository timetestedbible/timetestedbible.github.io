<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 700" font-family="Gentium Book Plus">
  <!-- The geometry of the Day, drawn in two panels. Pure black for the trade interior.
       Top: opposition seen from above — sun, earth, and full moon on one axis;
             the new moon beside the sun (dark) and the quarter at right angles.
       Bottom: the observer's night — sun setting west, full moon rising east,
             and the moon's dashed course across the night sky. -->

  <!-- ===== TOP: FULNESS IS OPPOSITION ===== -->
  <text x="440" y="42" text-anchor="middle" font-size="24" font-weight="bold" fill="#000000">FULNESS IS OPPOSITION</text>
  <text x="440" y="70" text-anchor="middle" font-size="20" font-style="italic" fill="#000000">the one phase that faces the sun whole</text>

  <!-- the opposition axis -->
  <line x1="90" y1="185" x2="790" y2="185" stroke="#000000" stroke-width="1" stroke-dasharray="6,7"/>

  <!-- sun -->
  <circle cx="150" cy="185" r="40" fill="#ffffff" stroke="#000000" stroke-width="2.5"/>
  <g stroke="#000000" stroke-width="2">
    <line x1="150" y1="128" x2="150" y2="112"/>
    <line x1="150" y1="242" x2="150" y2="258"/>
    <line x1="93"  y1="185" x2="77"  y2="185"/>
    <line x1="207" y1="185" x2="223" y2="185"/>
    <line x1="110" y1="145" x2="99"  y2="134"/>
    <line x1="190" y1="145" x2="201" y2="134"/>
    <line x1="110" y1="225" x2="99"  y2="236"/>
    <line x1="190" y1="225" x2="201" y2="236"/>
  </g>
  <text x="150" y="290" text-anchor="middle" font-size="22" fill="#000000">sun</text>

  <!-- new moon beside the sun: its dark half faces the earth -->
  <circle cx="285" cy="185" r="14" fill="#000000" stroke="#000000" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="285" y="222" text-anchor="middle" font-size="16" font-style="italic" fill="#000000">new — dark</text>

  <!-- quarter, at right angles above the earth: half lit -->
  <path d="M 440 86 A 14 14 0 0 0 440 114 Z" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <path d="M 440 86 A 14 14 0 0 1 440 114 Z" fill="#000000" stroke="#000000" stroke-width="1.5"/>
  <text x="468" y="106" text-anchor="start" font-size="16" font-style="italic" fill="#000000">quarter — half</text>

  <!-- earth: night half away from the sun -->
  <path d="M 440 159 A 26 26 0 0 0 440 211 Z" fill="#ffffff" stroke="#000000" stroke-width="2.5"/>
  <path d="M 440 159 A 26 26 0 0 1 440 211 Z" fill="#000000" stroke="#000000" stroke-width="2.5"/>
  <text x="440" y="253" text-anchor="middle" font-size="22" fill="#000000">earth</text>

  <!-- full moon opposite the sun: lit face toward the earth's night side -->
  <path d="M 740 165 A 20 20 0 0 0 740 205 Z" fill="#ffffff" stroke="#000000" stroke-width="2.5"/>
  <path d="M 740 165 A 20 20 0 0 1 740 205 Z" fill="#000000" stroke="#000000" stroke-width="2.5"/>
  <text x="740" y="253" text-anchor="middle" font-size="22" fill="#000000">full moon</text>

  <!-- sight line: the night side sees the whole lit face -->
  <line x1="472" y1="172" x2="712" y2="172" stroke="#000000" stroke-width="1.2"/>
  <path d="M 712 172 L 700 167 L 700 177 Z" fill="#000000"/>
  <text x="592" y="158" text-anchor="middle" font-size="17" font-style="italic" fill="#000000">the night side sees the whole lit face</text>

  <!-- divider -->
  <line x1="70" y1="330" x2="810" y2="330" stroke="#000000" stroke-width="1"/>

  <!-- ===== BOTTOM: THE NIGHT HELD BETWEEN TWO FACING LIGHTS ===== -->
  <text x="440" y="372" text-anchor="middle" font-size="24" font-weight="bold" fill="#000000">THE NIGHT HELD BETWEEN TWO FACING LIGHTS</text>
  <text x="440" y="400" text-anchor="middle" font-size="20" font-style="italic" fill="#000000">as the sun sets in the west, the full moon rises in the east</text>

  <!-- the moon's course across the night, east to west -->
  <path d="M 740 566 Q 440 420 140 566" fill="none" stroke="#000000" stroke-width="1.5" stroke-dasharray="7,8"/>
  <path d="M 152 556 L 140 566 L 156 568 Z" fill="#000000"/>
  <circle cx="440" cy="493" r="14" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="440" y="470" text-anchor="middle" font-size="17" font-style="italic" fill="#000000">midnight</text>

  <!-- horizon -->
  <line x1="60" y1="600" x2="820" y2="600" stroke="#000000" stroke-width="2.5"/>

  <!-- rising full moon in the east -->
  <circle cx="740" cy="566" r="28" fill="#ffffff" stroke="#000000" stroke-width="2.5"/>

  <!-- horizon labels -->
  <text x="140" y="634" text-anchor="middle" font-size="20" font-weight="bold" fill="#000000">WEST</text>
  <text x="740" y="634" text-anchor="middle" font-size="20" font-weight="bold" fill="#000000">EAST</text>
  <text x="140" y="664" text-anchor="middle" font-size="18" fill="#000000">the moon sets at dawn</text>
  <text x="740" y="664" text-anchor="middle" font-size="18" fill="#000000">the moon rises at sunset</text>
</svg>
