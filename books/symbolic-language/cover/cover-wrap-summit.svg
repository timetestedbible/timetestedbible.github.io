</g>
<g id="layer-back-copy" fill="#e8e2d2" font-family="Noto Serif" font-size="45.0" style="filter:url(#softshadow)">
  <text x="202.5" y="382.5">Jesus was astonished that His disciples could not decode</text>
  <text x="202.5" y="460.5">the parable of the sower: “Know ye not this parable? and</text>
  <text x="202.5" y="538.5">how then will ye know all parables?”  The rebuke is only</text>
  <text x="202.5" y="616.5">fair if the answers were already on the table.</text>
  <text x="202.5" y="772.5">They were.</text>
  <text x="202.5" y="928.5">The Bible defines its own symbols — mountain, sea, tree,</text>
  <text x="202.5" y="1006.5">seed, garment, wing, moon — and carries those definitions</text>
  <text x="202.5" y="1084.5">across centuries and languages.  This book gathers the</text>
  <text x="202.5" y="1162.5">vocabulary, proves each symbol from Scripture's own</text>
  <text x="202.5" y="1240.5">cross-references, and then sits the final exam: the seven</text>
  <text x="202.5" y="1318.5">parables of the kingdom, derived from the Old Testament</text>
  <text x="202.5" y="1396.5">alone and graded against the Teacher's own answer key.</text>
</g>
