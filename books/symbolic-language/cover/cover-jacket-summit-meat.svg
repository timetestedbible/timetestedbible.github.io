<g id="layer-flap-front" fill="#f0ebdd" font-family="Noto Serif" font-size="48.0" style="filter:url(#softshadow)">
  <text x="5885.6" y="390.0" text-anchor="middle" fill="#eda820" letter-spacing="9.0" font-size="60.0">TIMETESTED.BIBLE</text>
  <text x="5416.8" y="543.0">The book ends; the study</text>
  <text x="5416.8" y="624.0">doesn’t. TimeTested.Bible is a</text>
  <text x="5416.8" y="705.0">free online study Bible built</text>
  <text x="5416.8" y="786.0">on the method you now hold:</text>
  <text x="5416.8" y="867.0">every verse of Scripture</text>
  <text x="5416.8" y="948.0">linked to the symbols,</text>
  <text x="5416.8" y="1029.0">studies, and sources behind</text>
  <text x="5416.8" y="1110.0">this book.</text>
  <text x="5416.8" y="1233.0">Pull every reference by key</text>
  <text x="5416.8" y="1314.0">word, by the Hebrew or Greek</text>
  <text x="5416.8" y="1395.0">beneath the English, and by</text>
  <text x="5416.8" y="1476.0">concept. What once took a</text>
  <text x="5416.8" y="1557.0">lifetime of concordance work</text>
  <text x="5416.8" y="1638.0">now takes minutes.</text>
  <text x="5416.8" y="1761.0">The digital-only symbol</text>
  <text x="5416.8" y="1842.0">studies and the complete</text>
  <text x="5416.8" y="1923.0">Hebrew Matthew live there</text>
  <text x="5416.8" y="2004.0">too — free.</text>
  <text x="5416.8" y="2127.0" font-style="italic">Take no man’s word — verify.</text>
</g>
