  <text x="4057.4" y="1102.8" font-size="327.7" transform="scale(1,1.18)" fill="#eda820" font-style="italic" textLength="1076.4" lengthAdjust="spacingAndGlyphs">MEAT</text>
  <rect x="3519.2" y="1346.3" width="1076.4" height="13.5" fill="#eda820"/>
  <text x="4057.4" y="1258.9" font-size="167.1" transform="scale(1,1.22)" fill="#f2ead6" textLength="1044.3" lengthAdjust="spacingAndGlyphs">THE BIBLE’S</text>
  <text x="4057.4" y="1417.0" font-size="167.1" transform="scale(1,1.22)" fill="#eda820" textLength="1044.3" lengthAdjust="spacingAndGlyphs">SYMBOLIC</text>
  <text x="4057.4" y="1575.0" font-size="167.1" transform="scale(1,1.22)" fill="#f2ead6" textLength="1044.3" lengthAdjust="spacingAndGlyphs">LANGUAGE</text>
  <rect x="3519.2" y="1966.5" width="1076.4" height="13.5" fill="#eda820"/>
  <text x="4057.4" y="2120.7" font-size="70.7" fill="#eda820" letter-spacing="8.0">DANIEL LARIMER</text>
  <text x="4385.4" y="2700.0" font-size="51.4" fill="#f2ead6" font-style="italic" font-weight="normal" letter-spacing="6.4">Over 140 symbols revealed</text>
</g>
<g id="layer-spine" style="filter:url(#softshadow)">
  <text x="3233.3" y="1427.1" font-size="90.0" font-family="Noto Serif" letter-spacing="5.4" text-anchor="middle" dominant-baseline="central" transform="rotate(90 3233.3 1427.1)"><tspan fill="#f2ead6" font-style="italic" font-weight="bold">MEAT</tspan><tspan fill="#f2ead6"> THE BIBLE’S SYMBOLIC LANGUAGE</tspan></text>
  <text x="3233.3" y="2565.0" font-size="34.5" fill="#f2ead6" font-family="Noto Serif" text-anchor="middle" letter-spacing="2.4">DANIEL</text>
  <text x="3233.3" y="2625.0" font-size="34.5" fill="#f2ead6" font-family="Noto Serif" text-anchor="middle" letter-spacing="2.4">LARIMER</text>
</g>
<g id="layer-back-copy" fill="#f0ebdd" font-family="Noto Serif" font-size="60.0" style="filter:url(#softshadow)">
  <text x="2118.8" y="356.7" text-anchor="middle" font-style="italic">“I have fed you with <tspan fill="#eda820" font-style="italic">milk</tspan>, and not with <tspan fill="#eda820" font-style="italic">meat</tspan>:</text>
  <text x="2118.8" y="455.7" text-anchor="middle" font-style="italic">for hitherto ye were not able to bear it.”</text>
  <text x="2118.8" y="554.7" text-anchor="middle" font-size="48.0">1 Corinthians 3:2</text>
  <text x="1383.8" y="713.7">By this time you ought to be eating meat.</text>
  <text x="1383.8" y="872.7" textLength="1470.0" lengthAdjust="spacing">The wise and faithful servant gives the household</text>
  <text x="1383.8" y="971.7" textLength="1470.0" lengthAdjust="spacing"><tspan fill="#eda820" font-style="italic">“meat in due season,”</tspan> becomes a <tspan font-style="italic">“steward of the</tspan></text>
  <text x="1383.8" y="1070.7" textLength="1470.0" lengthAdjust="spacing"><tspan font-style="italic">mysteries of God,”</tspan> and has his senses <tspan font-style="italic">“exercised</tspan></text>
  <text x="1383.8" y="1169.7" textLength="1470.0" lengthAdjust="spacing"><tspan font-style="italic">to discern”</tspan> all parables. Would Jesus rebuke you</text>
  <text x="1383.8" y="1268.7" textLength="1470.0" lengthAdjust="spacing">as he did his disciples: <tspan fill="#eda820" font-style="italic">“Know ye not this parable?</tspan></text>
  <text x="1383.8" y="1367.7"><tspan fill="#eda820" font-style="italic">and how then will ye know all parables?”</tspan></text>
  <text x="1383.8" y="1526.7" textLength="1470.0" lengthAdjust="spacing">This book feeds meat — not a closed set of mysteries</text>
  <text x="1383.8" y="1625.7" textLength="1470.0" lengthAdjust="spacing">explained, but lessons in how to seek and discover</text>
  <text x="1383.8" y="1724.7" textLength="1470.0" lengthAdjust="spacing">fresh meat on your own. With more than 140 symbols</text>
  <text x="1383.8" y="1823.7" textLength="1470.0" lengthAdjust="spacing">proved from Scripture’s own cross-references, it</text>
  <text x="1383.8" y="1922.7">brings the Bible to life.</text>
  <text x="1383.8" y="2081.7" font-style="italic">Come — meet the Bible’s symbolic language.</text>
</g>
<g id="layer-back-hebrews" fill="#f0ebdd" font-family="Noto Serif" style="filter:url(#softshadow)">
  <text x="1873.1" y="2409.0" text-anchor="middle" font-style="italic" font-size="54.0">“For every one that useth <tspan fill="#eda820" font-style="italic">milk</tspan></text>
  <text x="1873.1" y="2487.0" text-anchor="middle" font-style="italic" font-size="54.0">is unskilful in the word</text>
  <text x="1873.1" y="2565.0" text-anchor="middle" font-style="italic" font-size="54.0">of righteousness.”</text>
  <text x="1873.1" y="2643.0" text-anchor="middle" font-size="45.0">Hebrews 5:13</text>
</g>
