  <rect x="2227.5" y="1257.0" width="1005.0" height="12.6" fill="#eda820"/>
  <text x="2730.0" y="1175.4" font-size="156.0" transform="scale(1,1.22)" fill="#f2ead6" textLength="975.0" lengthAdjust="spacingAndGlyphs">THE BIBLE’S</text>
  <text x="2730.0" y="1323.0" font-size="156.0" transform="scale(1,1.22)" fill="#eda820" textLength="975.0" lengthAdjust="spacingAndGlyphs">SYMBOLIC</text>
  <text x="2730.0" y="1470.5" font-size="156.0" transform="scale(1,1.22)" fill="#f2ead6" textLength="975.0" lengthAdjust="spacingAndGlyphs">LANGUAGE</text>
  <rect x="2227.5" y="1836.0" width="1005.0" height="12.6" fill="#eda820"/>
  <text x="2730.0" y="1980.0" font-size="66.0" fill="#eda820" letter-spacing="7.5">DANIEL LARIMER</text>
  <text x="3058.2" y="2586.0" font-size="48.0" fill="#f2ead6" font-style="italic" font-weight="normal" letter-spacing="6.0">Over 140 symbols revealed</text>
</g>
<g id="layer-spine" style="filter:url(#softshadow)">
  <text x="1997.8" y="1387.5" font-size="81.0" font-family="Noto Serif" letter-spacing="5.4" text-anchor="middle" dominant-baseline="central" transform="rotate(90 1997.8 1387.5)"><tspan fill="#f2ead6" font-style="italic" font-weight="bold">MEAT</tspan><tspan fill="#f2ead6"> THE BIBLE’S SYMBOLIC LANGUAGE</tspan></text>
  <text x="1997.8" y="2490.0" font-size="34.5" fill="#f2ead6" font-family="Noto Serif" text-anchor="middle" letter-spacing="2.4">DANIEL</text>
  <text x="1997.8" y="2550.0" font-size="34.5" fill="#f2ead6" font-family="Noto Serif" text-anchor="middle" letter-spacing="2.4">LARIMER</text>
</g>
<g id="layer-back-copy" fill="#f0ebdd" font-family="Noto Serif" font-size="60.0" style="filter:url(#softshadow)">
  <text x="937.5" y="352.5" text-anchor="middle" font-style="italic">“I have fed you with <tspan fill="#eda820" font-style="italic">milk</tspan>, and not with <tspan fill="#eda820" font-style="italic">meat</tspan>:</text>
  <text x="937.5" y="451.5" text-anchor="middle" font-style="italic">for hitherto ye were not able to bear it.”</text>
  <text x="937.5" y="550.5" text-anchor="middle" font-size="48.0">1 Corinthians 3:2</text>
  <text x="202.5" y="709.5">By this time you ought to be eating meat.</text>
  <text x="202.5" y="868.5" textLength="1470.0" lengthAdjust="spacing">The wise and faithful servant gives the household</text>
  <text x="202.5" y="967.5" textLength="1470.0" lengthAdjust="spacing"><tspan fill="#eda820" font-style="italic">“meat in due season,”</tspan> becomes a <tspan font-style="italic">“steward of the</tspan></text>
  <text x="202.5" y="1066.5" textLength="1470.0" lengthAdjust="spacing"><tspan font-style="italic">mysteries of God,”</tspan> and has his senses <tspan font-style="italic">“exercised</tspan></text>
  <text x="202.5" y="1165.5" textLength="1470.0" lengthAdjust="spacing"><tspan font-style="italic">to discern”</tspan> all parables. Would Jesus rebuke you</text>
  <text x="202.5" y="1264.5" textLength="1470.0" lengthAdjust="spacing">as he did his disciples: <tspan fill="#eda820" font-style="italic">“Know ye not this parable?</tspan></text>
  <text x="202.5" y="1363.5"><tspan fill="#eda820" font-style="italic">and how then will ye know all parables?”</tspan></text>
  <text x="202.5" y="1522.5" textLength="1470.0" lengthAdjust="spacing">This book feeds meat — not a closed set of mysteries</text>
  <text x="202.5" y="1621.5" textLength="1470.0" lengthAdjust="spacing">explained, but lessons in how to seek and discover</text>
  <text x="202.5" y="1720.5" textLength="1470.0" lengthAdjust="spacing">fresh meat on your own. With more than 140 symbols</text>
  <text x="202.5" y="1819.5" textLength="1470.0" lengthAdjust="spacing">proved from Scripture’s own cross-references, it</text>
  <text x="202.5" y="1918.5">brings the Bible to life.</text>
  <text x="202.5" y="2077.5" font-style="italic">Come — meet the Bible’s symbolic language.</text>
</g>
<g id="layer-back-hebrews" fill="#f0ebdd" font-family="Noto Serif" style="filter:url(#softshadow)">
  <text x="663.8" y="2334.0" text-anchor="middle" font-style="italic" font-size="54.0">“For every one that useth <tspan fill="#eda820" font-style="italic">milk</tspan></text>
  <text x="663.8" y="2412.0" text-anchor="middle" font-style="italic" font-size="54.0">is unskilful in the word</text>
  <text x="663.8" y="2490.0" text-anchor="middle" font-style="italic" font-size="54.0">of righteousness.”</text>
  <text x="663.8" y="2568.0" text-anchor="middle" font-size="45.0">Hebrews 5:13</text>
</g>
