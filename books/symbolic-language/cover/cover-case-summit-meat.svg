<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="15.049027777777777in" height="10.5in" viewBox="0 0 4514.7 3150.0" font-family="Noto Serif, Georgia, serif">
