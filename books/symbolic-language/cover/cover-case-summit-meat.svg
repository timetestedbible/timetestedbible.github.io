<g id="layer-background"><!-- swap href for the hi-res regeneration; keep x/y/width/height -->
  <image xlink:href="symbol-cover-4x.png" x="-863.7" y="118.2" width="6888.0" height="2922.0" preserveAspectRatio="xMidYMid slice" transform="translate(0,236.3) scale(1,-1)"/>
