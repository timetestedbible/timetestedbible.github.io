</style>
<defs>
  <filter id="softshadow" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#000" flood-opacity="0.9"/>
    <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.9"/>
  </filter>
  <linearGradient id="backfill" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#0a0e1c"/><stop offset="100%" stop-color="#101830"/>
  </linearGradient>
</defs>
<g id="layer-basefill"><rect width="4514.7" height="3150.0" fill="url(#backfill)"/></g>
<g id="layer-background"><!-- swap href for the hi-res regeneration; keep x/y/width/height -->
  <image xlink:href="symbol-cover-4x.png" x="-886.6" y="116.1" width="6888.0" height="2922.0" preserveAspectRatio="xMidYMid slice"/></g>
<g id="layer-front-title" font-family="Noto Serif" font-weight="bold" text-anchor="middle" style="filter:url(#softshadow)">
  <text x="3160.0" y="1116.5" font-size="302.6" transform="scale(1,1.18)" fill="#eda820" font-style="italic" textLength="993.8" lengthAdjust="spacingAndGlyphs">MEAT</text>
  <rect x="2663.2" y="1359.0" width="993.8" height="12.5" fill="#eda820"/>
  <text x="3160.0" y="1257.4" font-size="154.3" transform="scale(1,1.22)" fill="#f2ead6" textLength="964.1" lengthAdjust="spacingAndGlyphs">THE BIBLE’S</text>
  <text x="3160.0" y="1403.3" font-size="154.3" transform="scale(1,1.22)" fill="#eda820" textLength="964.1" lengthAdjust="spacingAndGlyphs">SYMBOLIC</text>
  <text x="3160.0" y="1549.2" font-size="154.3" transform="scale(1,1.22)" fill="#f2ead6" textLength="964.1" lengthAdjust="spacingAndGlyphs">LANGUAGE</text>
  <rect x="2663.2" y="1931.6" width="993.8" height="12.5" fill="#eda820"/>
  <text x="3160.0" y="2074.0" font-size="65.3" fill="#eda820" letter-spacing="7.4">DANIEL LARIMER</text>
  <text x="3483.3" y="2805.0" font-size="47.5" fill="#f2ead6" font-style="italic" font-weight="normal" letter-spacing="5.9">Over 140 symbols revealed</text>
</g>
<g id="layer-spine" style="filter:url(#softshadow)">
  <text x="2258.3" y="1577.1" font-size="90.0" font-family="Noto Serif" letter-spacing="5.4" text-anchor="middle" dominant-baseline="central" transform="rotate(90 2258.3 1577.1)"><tspan fill="#f2ead6" font-style="italic" font-weight="bold">MEAT</tspan><tspan fill="#f2ead6"> THE BIBLE’S SYMBOLIC LANGUAGE</tspan></text>
  <text x="2258.3" y="2715.0" font-size="34.5" fill="#f2ead6" font-family="Noto Serif" text-anchor="middle" letter-spacing="2.4">DANIEL</text>
  <text x="2258.3" y="2775.0" font-size="34.5" fill="#f2ead6" font-family="Noto Serif" text-anchor="middle" letter-spacing="2.4">LARIMER</text>
</g>
<g id="layer-back-copy" fill="#f0ebdd" font-family="Noto Serif" font-size="60.0" style="filter:url(#softshadow)">
  <text x="1033.5" y="533.7" text-anchor="middle" font-style="italic">“I have fed you with <tspan fill="#eda820" font-style="italic">milk</tspan>, and not with <tspan fill="#eda820" font-style="italic">meat</tspan>:</text>
  <text x="1033.5" y="632.7" text-anchor="middle" font-style="italic">for hitherto ye were not able to bear it.”</text>
  <text x="1033.5" y="731.7" text-anchor="middle" font-size="48.0">1 Corinthians 3:2</text>
  <text x="298.5" y="890.7">By this time you ought to be eating meat.</text>
  <text x="298.5" y="1049.7" textLength="1470.0" lengthAdjust="spacing">The wise and faithful servant gives the household</text>
  <text x="298.5" y="1148.7" textLength="1470.0" lengthAdjust="spacing"><tspan fill="#eda820" font-style="italic">“meat in due season,”</tspan> becomes a <tspan font-style="italic">“steward of the</tspan></text>
  <text x="298.5" y="1247.7" textLength="1470.0" lengthAdjust="spacing"><tspan font-style="italic">mysteries of God,”</tspan> and has his senses <tspan font-style="italic">“exercised</tspan></text>
  <text x="298.5" y="1346.7" textLength="1470.0" lengthAdjust="spacing"><tspan font-style="italic">to discern”</tspan> all parables. Would Jesus rebuke you</text>
  <text x="298.5" y="1445.7" textLength="1470.0" lengthAdjust="spacing">as he did his disciples: <tspan fill="#eda820" font-style="italic">“Know ye not this parable?</tspan></text>
  <text x="298.5" y="1544.7"><tspan fill="#eda820" font-style="italic">and how then will ye know all parables?”</tspan></text>
  <text x="298.5" y="1703.7" textLength="1470.0" lengthAdjust="spacing">This book feeds meat — not a closed set of mysteries</text>
  <text x="298.5" y="1802.7" textLength="1470.0" lengthAdjust="spacing">explained, but lessons in how to seek and discover</text>
  <text x="298.5" y="1901.7" textLength="1470.0" lengthAdjust="spacing">fresh meat on your own. With more than 140 symbols</text>
  <text x="298.5" y="2000.7" textLength="1470.0" lengthAdjust="spacing">proved from Scripture’s own cross-references, it</text>
  <text x="298.5" y="2099.7">brings the Bible to life.</text>
  <text x="298.5" y="2258.7" font-style="italic">Come — meet the Bible’s symbolic language.</text>
</g>
<g id="layer-back-hebrews" fill="#f0ebdd" font-family="Noto Serif" style="filter:url(#softshadow)">
  <text x="1033.3" y="2559.0" text-anchor="middle" font-style="italic" font-size="54.0">“For every one that useth <tspan fill="#eda820" font-style="italic">milk</tspan></text>
  <text x="1033.3" y="2637.0" text-anchor="middle" font-style="italic" font-size="54.0">is unskilful in the word</text>
  <text x="1033.3" y="2715.0" text-anchor="middle" font-style="italic" font-size="54.0">of righteousness.”</text>
  <text x="1033.3" y="2793.0" text-anchor="middle" font-size="45.0">Hebrews 5:13</text>
</g>
