<g id="layer-front-title" font-family="Noto Serif" font-weight="bold" text-anchor="middle" style="filter:url(#softshadow)">
  <text x="3183.0" y="1118.3" font-size="302.6" transform="scale(1,1.18)" fill="#eda820" font-style="italic" textLength="993.8" lengthAdjust="spacingAndGlyphs">MEAT</text>
  <rect x="2686.1" y="1361.1" width="993.8" height="12.5" fill="#eda820"/>
  <text x="3183.0" y="1259.1" font-size="154.3" transform="scale(1,1.22)" fill="#f2ead6" textLength="964.1" lengthAdjust="spacingAndGlyphs">THE BIBLE’S</text>
  <text x="3183.0" y="1405.0" font-size="154.3" transform="scale(1,1.22)" fill="#eda820" textLength="964.1" lengthAdjust="spacingAndGlyphs">SYMBOLIC</text>
  <text x="3183.0" y="1550.9" font-size="154.3" transform="scale(1,1.22)" fill="#f2ead6" textLength="964.1" lengthAdjust="spacingAndGlyphs">LANGUAGE</text>
  <rect x="2686.1" y="1933.7" width="993.8" height="12.5" fill="#eda820"/>
  <text x="3183.0" y="2076.1" font-size="65.3" fill="#eda820" letter-spacing="7.4">DANIEL LARIMER</text>
  <text x="3506.3" y="2805.0" font-size="47.5" fill="#f2ead6" font-style="italic" font-weight="normal" letter-spacing="5.9">Over 160 symbols and words revealed</text>
</g>
<g id="layer-spine" style="filter:url(#softshadow)">
  <text x="2269.2" y="1579.2" font-size="90.0" font-family="Noto Serif" letter-spacing="5.4" text-anchor="middle" dominant-baseline="central" transform="rotate(90 2269.2 1579.2)"><tspan fill="#f2ead6" font-style="italic" font-weight="bold">MEAT</tspan><tspan fill="#f2ead6"> THE BIBLE’S SYMBOLIC LANGUAGE</tspan></text>
  <text x="2269.2" y="2719.2" font-size="34.5" fill="#f2ead6" font-family="Noto Serif" text-anchor="middle" letter-spacing="2.4">DANIEL</text>
  <text x="2269.2" y="2779.2" font-size="34.5" fill="#f2ead6" font-family="Noto Serif" text-anchor="middle" letter-spacing="2.4">LARIMER</text>
</g>
<g id="layer-back-copy" fill="#f0ebdd" font-family="Noto Serif" font-size="60.0" style="filter:url(#softshadow)">
  <text x="1033.5" y="533.7" text-anchor="middle" font-style="italic">“I fed you with <tspan fill="#eda820" font-style="italic">milk</tspan> and not with <tspan fill="#eda820" font-style="italic">meat</tspan>;</text>
  <text x="1033.5" y="632.7" text-anchor="middle" font-style="italic">for until now you were not able to receive it,</text>
  <text x="1033.5" y="731.7" text-anchor="middle" font-style="italic">and even now you are still not able.”</text>
  <text x="1033.5" y="830.7" text-anchor="middle" font-size="48.0">1 Corinthians 3:2</text>
  <text x="298.5" y="989.7">By this time you ought to be eating meat.</text>
  <text x="298.5" y="1148.7" textLength="1470.0" lengthAdjust="spacing">The wise and faithful servant gives the household</text>
  <text x="298.5" y="1247.7" textLength="1470.0" lengthAdjust="spacing"><tspan fill="#eda820" font-style="italic">“meat in due season,”</tspan> becomes a <tspan font-style="italic">“steward of the</tspan></text>
  <text x="298.5" y="1346.7" textLength="1470.0" lengthAdjust="spacing"><tspan font-style="italic">mysteries of God,”</tspan> and has his senses <tspan font-style="italic">“exercised</tspan></text>
  <text x="298.5" y="1445.7" textLength="1470.0" lengthAdjust="spacing"><tspan font-style="italic">to discern”</tspan> all parables. Would Jesus rebuke you</text>
  <text x="298.5" y="1544.7" textLength="1470.0" lengthAdjust="spacing">as he did his disciples: <tspan fill="#eda820" font-style="italic">“Know ye not this parable?</tspan></text>
  <text x="298.5" y="1643.7"><tspan fill="#eda820" font-style="italic">and how then will ye know all parables?”</tspan></text>
  <text x="298.5" y="1802.7" textLength="1470.0" lengthAdjust="spacing">This book feeds meat — not a closed set of mysteries</text>
  <text x="298.5" y="1901.7" textLength="1470.0" lengthAdjust="spacing">explained, but lessons in how to seek and discover</text>
  <text x="298.5" y="2000.7" textLength="1470.0" lengthAdjust="spacing">fresh meat on your own. With more than 160 symbols</text>
  <text x="298.5" y="2099.7" textLength="1470.0" lengthAdjust="spacing">and recovered words proved from Scripture’s own</text>
  <text x="298.5" y="2198.7">cross-references, it brings the Bible to life.</text>
  <text x="298.5" y="2357.7" font-style="italic">Come — meet the Bible’s symbolic language.</text>
</g>
<g id="layer-back-hebrews" fill="#f0ebdd" font-family="Noto Serif" style="filter:url(#softshadow)">
  <text x="1032.1" y="2563.2" text-anchor="middle" font-style="italic" font-size="54.0">“For everyone who partakes</text>
  <text x="1032.1" y="2641.2" text-anchor="middle" font-style="italic" font-size="54.0">only of <tspan fill="#eda820" font-style="italic">milk</tspan> is unskilled in the</text>
  <text x="1032.1" y="2719.2" text-anchor="middle" font-style="italic" font-size="54.0">word of righteousness,</text>
  <text x="1032.1" y="2797.2" text-anchor="middle" font-style="italic" font-size="54.0">for he is a babe.”</text>
  <text x="1032.1" y="2875.2" text-anchor="middle" font-size="45.0">Hebrews 5:13</text>
</g>
</svg>
