<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="15.128055555555555in" height="10.5in" viewBox="0 0 4538.4 3150.0" font-family="Noto Serif, Georgia, serif">
