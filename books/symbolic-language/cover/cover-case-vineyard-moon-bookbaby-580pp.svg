<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="15.363333333in" height="10.5in" viewBox="0 0 4609 3150">
  <!--
    HARDCOVER CASE (BookBaby US-Trade-Hard-Cover (6), 580pp):
    wrap 0.625in | back 6.25in | spine 1.613333in | front 6.25in |
    wrap 0.625in.

    The 23.5px template increase is confined to the spine. Back and front
    artwork retain their exact approved proportions. No ISBN/barcode is used
    on the case artwork.
  -->
  <defs>
    <clipPath id="case-source-clip">
      <rect width="4585.5" height="3150"/>
    </clipPath>
    <linearGradient id="case-bottom-outpaint-fade" gradientUnits="userSpaceOnUse"
                    x1="0" y1="2860" x2="0" y2="3150">
      <stop offset="0" stop-color="black"/>
      <stop offset="35.35%" stop-color="white"/>
      <stop offset="100%" stop-color="white"/>
    </linearGradient>
    <mask id="case-bottom-outpaint-mask" maskUnits="userSpaceOnUse"
          x="0" y="2860" width="4585.5" height="290">
      <rect x="0" y="2860" width="4585.5" height="290"
            fill="url(#case-bottom-outpaint-fade)"/>
    </mask>
    <g id="case-background-source" clip-path="url(#case-source-clip)">
      <svg x="0" y="187.5" width="4585.5" height="2775"
           viewBox="934.160135 37.5 4667.17973 2775" preserveAspectRatio="none">
        <image xlink:href="../../../output/imagegen/meat-vineyard-cover/cover-jacket-vineyard-moon-bookbaby-v2-background-native.png"
               x="0" y="0" width="6535.5" height="2850" preserveAspectRatio="none"/>
      </svg>
      <g transform="translate(0 375) scale(1 -1)">
        <svg x="0" y="187.5" width="4585.5" height="187.5"
             viewBox="934.160135 37.5 4667.17973 187.5" preserveAspectRatio="none">
          <image xlink:href="../../../output/imagegen/meat-vineyard-cover/cover-jacket-vineyard-moon-bookbaby-v2-background-native.png"
                 x="0" y="0" width="6535.5" height="2850" preserveAspectRatio="none"/>
        </svg>
      </g>
      <svg x="0" y="2860" width="4585.5" height="290"
           viewBox="0 943.25 1514 95.75" preserveAspectRatio="none"
           mask="url(#case-bottom-outpaint-mask)">
        <image xlink:href="../../../output/imagegen/meat-vineyard-cover/20-case-bottom-outpaint-render-source.jpg"
               x="0" y="0" width="1514" height="1039" preserveAspectRatio="none"/>
      </svg>
    </g>
    <clipPath id="left-panel-clip">
      <rect x="0" y="0" width="2062.5" height="3150"/>
    </clipPath>
    <clipPath id="spine-panel-clip">
      <rect x="2062.5" y="0" width="484" height="3150"/>
    </clipPath>
    <clipPath id="right-panel-clip">
      <rect x="2546.5" y="0" width="2062.5" height="3150"/>
    </clipPath>
  </defs>

  <!-- Preserve both case panels; extend only the center strip. -->
  <g clip-path="url(#left-panel-clip)">
    <use xlink:href="#case-background-source"/>
  </g>
  <g clip-path="url(#spine-panel-clip)">
    <g transform="translate(2062.5 0) scale(1.051031487514 1) translate(-2062.5 0)">
      <use xlink:href="#case-background-source"/>
    </g>
  </g>
  <g clip-path="url(#right-panel-clip)">
    <g transform="translate(23.5 0)">
      <use xlink:href="#case-background-source"/>
    </g>
  </g>

  <!-- Map each typographic panel independently to the new case geometry. -->
  <use xlink:href="cover-jacket-vineyard-moon-bookbaby-v2.svg#layer-back-copy"
       transform="translate(-915.441176 150) scale(.980392157 1)"/>
  <use xlink:href="cover-jacket-vineyard-moon-bookbaby-v2.svg#layer-spine"
       transform="translate(-963.25 150)"/>
  <use xlink:href="cover-jacket-vineyard-moon-bookbaby-v2.svg#layer-front-title"
       transform="translate(-882.911765 150) scale(.980392157 1)"/>
</svg>
