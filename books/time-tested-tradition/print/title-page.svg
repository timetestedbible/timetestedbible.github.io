<?xml version="1.0" encoding="UTF-8"?>
<!-- Title page for the 6x9 trade edition (432pt x 648pt), mirroring the series
     cover lockup at 72pt/in: TIME in tall italic caps with an underline, the
     title completing down the stack (TESTED / TRADITION) bracketed by a
     closing rule, the calendar subtitle and author beneath the frame, and the
     watchman cover's verse as the foot-line. Lines are stretched with
     textLength so the block shares one width; tall caps come from a
     non-uniform scale with y pre-divided by the factor.
     All ink is pure black (#000000) - BookBaby rejects color/gray interiors. -->
<svg xmlns="http://www.w3.org/2000/svg" width="432" height="648" viewBox="0 0 432 648">
  <rect width="432" height="648" fill="#ffffff"/>

  <g font-family="Noto Serif" fill="#000000" text-anchor="middle">
    <!-- TIME — baseline 216 (y = 216/1.18); identical metrics to MEAT's page -->
    <text x="216" y="183.05" font-size="73.4" font-style="italic" font-weight="bold"
          transform="scale(1,1.18)" textLength="241.2" lengthAdjust="spacingAndGlyphs">TIME</text>
    <!-- underline / top of the frame -->
    <rect x="95.4" y="226" width="241.2" height="3"/>
    <!-- the title completes down the stack — same size and pitch as MEAT's -->
    <text x="216" y="220.2" font-size="37.4" transform="scale(1,1.22)" textLength="234" lengthAdjust="spacingAndGlyphs">TESTED</text>
    <text x="216" y="255.6" font-size="37.4" transform="scale(1,1.22)" textLength="234" lengthAdjust="spacingAndGlyphs">TRADITION</text>
    <!-- closing rule — same 10pt clearance under the last stack line as MEAT -->
    <rect x="95.4" y="322" width="241.2" height="3"/>
    <!-- author directly beneath the frame, nothing between — the cover's order -->
    <text x="216" y="357" font-size="15.8" letter-spacing="1.8">DANIEL LARIMER</text>
  </g>

  <!-- the cover's italic foot-tagline slot carries the subtitle; epigraph below -->
  <g font-family="Noto Serif" font-style="italic" fill="#000000" text-anchor="middle">
    <text x="216" y="524" font-size="13">The Renewed Biblical Calendar</text>
    <text x="216" y="566" font-size="11.5">The one who states his case first seems right,</text>
    <text x="216" y="584" font-size="11.5">until the other comes and examines him.</text>
    <text x="216" y="608" font-size="11.5">&#8212; Proverbs 18:17</text>
  </g>
</svg>
