<?xml version="1.0" encoding="UTF-8"?>
<!-- Title page for the 6x9 trade edition (432pt x 648pt), mapped at height
     ratio (648/2850) from the actual jacket lockup in
     books/time-tested-tradition/cover/cover-jacket-sun-moon.svg:
     TIME (underlined) / TESTED / TRADITION / rule / Renewed Biblical
     Calendar (italic) / SECOND EDITION / gap / DANIEL LARIMER at the foot.
     The verse sits in the gap the cover fills with art (author's ruling).
     All ink pure black (#000000) - BookBaby rejects color/gray interiors. -->
<svg xmlns="http://www.w3.org/2000/svg" width="432" height="648" viewBox="0 0 432 648">
  <rect width="432" height="648" fill="#ffffff"/>

  <g font-family="Noto Serif" font-weight="bold" fill="#000000" text-anchor="middle">
    <!-- TIME - cover baseline 747/2850 -> 169.9; tall caps 1.18 -->
    <text x="216" y="144.0" font-size="82" font-style="italic"
          transform="scale(1,1.18)" textLength="269.3" lengthAdjust="spacingAndGlyphs">TIME</text>
    <rect x="81.4" y="180.4" width="269.3" height="3"/>
    <!-- stack - cover 167.1(x1.1) -> 41.8pt, tall caps 1.22 -->
    <text x="216" y="190.5" font-size="41.8" transform="scale(1,1.22)" textLength="261.2" lengthAdjust="spacingAndGlyphs">TESTED</text>
    <text x="216" y="230.2" font-size="41.8" transform="scale(1,1.22)" textLength="261.2" lengthAdjust="spacingAndGlyphs">TRADITION</text>
    <rect x="81.4" y="289.2" width="269.3" height="3"/>
    <!-- subtitle beneath the rule, stretched as on the jacket -->
    <text x="216" y="322.4" font-size="20" font-style="italic" font-weight="normal"
          textLength="261.2" lengthAdjust="spacingAndGlyphs">Renewed Biblical Calendar</text>
    <!-- edition -->
    <text x="216" y="349.7" font-size="9.6" font-weight="normal" letter-spacing="2.5">SECOND EDITION</text>
    <!-- author at the panel foot, as on the jacket -->
    <text x="216" y="588" font-size="11.8" letter-spacing="2.95">DANIEL LARIMER</text>
  </g>

  <!-- the verse, in the gap the jacket fills with art -->
  <g font-family="Noto Serif" font-style="italic" fill="#000000" text-anchor="middle">
    <text x="216" y="466" font-size="11.5">The one who states his case first seems right,</text>
    <text x="216" y="484" font-size="11.5">until the other comes and examines him.</text>
    <text x="216" y="508" font-size="11.5">&#8212; Proverbs 18:17</text>
  </g>
</svg>
