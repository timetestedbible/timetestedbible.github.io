name: Desktop Release (Tauri + Electron)

# Builds BOTH desktop shells for macOS, Windows, and Linux and attaches the
# installers to a GitHub Release.
#
#   - Tauri    = the lightweight default build (tiny, OS webview)
#   - Electron = the compatibility fallback (bundled Chromium)
#
# Trigger: push a tag like `v2.2.0`, or run manually (workflow_dispatch).
# Builds are UNSIGNED (by design — see _dev/desktop-release-notes.md for user steps).

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build (e.g. v2.2.0)'
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  # ── Create the draft release once; build jobs upload assets into it ──
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Time Tested Bible ${{ env.TAG }}
          draft: true
          body_path: _dev/desktop-release-notes.md

  # ── Build the site ONCE (Jekyll only runs here), trim it, share it ──
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: '3.3', bundler-cache: true }
      - run: bundle exec jekyll build
      - name: Trim the site for bundling (.gz-only + 2nd-ed PDF)
        run: node _dev/desktop-tauri/build-desktop-site.js
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: _dev/desktop-tauri/desktop-site
          retention-days: 1
          include-hidden-files: true

  # ── Tauri (default build) ──
  tauri:
    needs: [create-release, prepare]
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-13, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch prepared site -> desktop-site
        uses: actions/download-artifact@v4
        with:
          name: site
          path: _dev/desktop-tauri/desktop-site
      - name: Linux WebKit dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Build + upload Tauri bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: _dev/desktop-tauri/src-tauri
          tagName: ${{ env.TAG }}
          releaseName: Time Tested Bible ${{ env.TAG }}
          # GitHub Actions sets CI=true, so the dmg's Finder/AppleScript styling is
          # auto-skipped; native arch per runner.

  # ── Electron (compatibility fallback) ──
  electron:
    needs: [create-release, prepare]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14,       eb: '--mac --arm64' }
          - { os: macos-13,       eb: '--mac --x64' }
          - { os: windows-latest, eb: '--win --x64' }
          - { os: ubuntu-22.04,   eb: '--linux --x64' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch prepared site -> _site
        uses: actions/download-artifact@v4
        with:
          name: site
          path: _site
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Install Electron deps
        working-directory: _dev/desktop
        run: npm install --no-audit --no-fund   # lockfile is out of sync; install reconciles
      - name: Build Electron installers
        working-directory: _dev/desktop
        run: npx electron-builder ${{ matrix.eb }} --publish never
      - name: Upload Electron artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: |
            _dev/desktop/dist/*.dmg
            _dev/desktop/dist/*.zip
            _dev/desktop/dist/*.exe
            _dev/desktop/dist/*.AppImage
            _dev/desktop/dist/*.deb

  # ── Flip the release out of draft once everything uploaded ──
  publish:
    needs: [tauri, electron]
    runs-on: ubuntu-latest
    steps:
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          draft: false
