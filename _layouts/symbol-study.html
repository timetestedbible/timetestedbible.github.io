---
layout: default
---
<article class="symbol-study-content symbol-article-body" style="max-width: 800px; margin: 0 auto; padding: 20px 24px;" role="article" aria-label="{{ page.title }}">
  {{ content }}
</article>
<script>
(function() {
  // Cache the Jekyll-rendered article HTML so the SPA can reuse it
  // without re-fetching the page. Runs synchronously before DOMContentLoaded,
  // so the HTML is saved before ContentManager replaces #content-area.
  var article = document.querySelector('article.symbol-study-content');
  if (article) {
    window.__jekyllArticle = { type: 'symbol', html: article.innerHTML };
  }
})();
</script>
