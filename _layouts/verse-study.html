---
layout: default
---
<article class="verse-study-content symbol-article-body" style="max-width: 800px; margin: 0 auto; padding: 20px 24px;" role="article" aria-label="{{ page.title }}">
  {{ content }}
</article>
<script>
(function() {
  var article = document.querySelector('article.verse-study-content');
  if (article) {
    window.__jekyllArticle = { type: 'verse', html: article.innerHTML };
  }
})();
</script>
